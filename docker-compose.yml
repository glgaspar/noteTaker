services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notetaker
      POSTGRES_PASSWORD: notetaker
      POSTGRES_DB: notetaker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  # S3-compatible storage for attachments (optional; the app runs without it)
  files:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: notetaker
      RUSTFS_SECRET_KEY: notetaker-secret
    ports:
      - "9000:9000"
    volumes:
      - files:/data

volumes:
  pgdata:
  files:

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: notetaker
      POSTGRES_PASSWORD: notetaker
      POSTGRES_DB: notetaker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "notetaker"]
      interval: 2s
      timeout: 3s
      retries: 15

  # S3-compatible storage for attachments (optional; the app runs without it)
  files:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: notetaker
      RUSTFS_SECRET_KEY: notetaker-secret
    ports:
      - "9000:9000"
    volumes:
      - files:/data

  # The app itself, for running everything in containers: docker compose --profile app up -d
  app:
    build: .
    profiles: [app]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://notetaker:notetaker@db:5432/notetaker?sslmode=disable
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      S3_ENDPOINT: files:9000
      S3_ACCESS_KEY: notetaker
      S3_SECRET_KEY: notetaker-secret
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-notetaker@localhost}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      files:
        condition: service_started

volumes:
  pgdata:
  files:

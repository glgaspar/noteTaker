{{define "content"}}{{template "authcard" .}}{{end}}
{{define "auth"}}
{{if .Invalid}}
<h1 class="text-[18px] font-semibold">Invite not found</h1>
<p class="mt-2 text-[13px] text-muted">This invite is invalid or has expired. Ask an admin for a new one.</p>
{{else}}
<h1 class="text-[18px] font-semibold">Create your account</h1>
<p class="mb-6 mt-1 text-[13px] text-muted">You were invited as <span class="font-medium text-ink">{{.Email}}</span>.</p>
{{with .Error}}<p class="alert-error mb-4">{{.}}</p>{{end}}
<form method="post" action="/invite/{{.Token}}" class="space-y-4">
  <label class="block"><span class="label">Your name</span>
    <input name="name" value="{{.Name}}" required autofocus class="input">
  </label>
  <label class="block"><span class="label">Password</span>
    <input name="password" type="password" minlength="8" required class="input" placeholder="At least 8 characters">
  </label>
  <button class="btn-primary h-9 w-full justify-center">Create account</button>
</form>
{{end}}
{{end}}

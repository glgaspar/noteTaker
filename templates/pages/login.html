{{define "content"}}{{template "authcard" .}}{{end}}
{{define "auth"}}
<h1 class="text-[18px] font-semibold">Welcome back</h1>
<p class="mb-6 mt-1 text-[13px] text-muted">Log in to your notes.</p>
{{with .Error}}<p class="alert-error mb-4">{{.}}</p>{{end}}
<form method="post" action="/login" class="space-y-4">
  <label class="block"><span class="label">Email</span>
    <input name="email" type="email" value="{{.Email}}" required autofocus class="input">
  </label>
  <label class="block"><span class="label">Password</span>
    <input name="password" type="password" required class="input">
  </label>
  <button class="btn-primary h-9 w-full justify-center">Log in</button>
</form>
{{end}}
{{define "authfooter"}}
<p class="mt-4 text-center text-[13px]"><a href="/forgot" class="text-muted hover:text-ink">Forgot your password?</a></p>
{{end}}

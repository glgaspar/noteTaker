{{define "content"}}
<div class="mx-auto mt-16 max-w-sm rounded-lg border border-stone-200 bg-white p-6 shadow-sm">
  <h1 class="mb-6 text-xl font-semibold">Log in to NoteTaker</h1>
  {{with .Error}}<p class="mb-4 rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{.}}</p>{{end}}
  <form method="post" action="/login" class="space-y-4">
    <label class="block text-sm">Email
      <input name="email" type="email" value="{{.Email}}" required autofocus
        class="mt-1 w-full rounded border border-stone-300 px-3 py-2">
    </label>
    <label class="block text-sm">Password
      <input name="password" type="password" required
        class="mt-1 w-full rounded border border-stone-300 px-3 py-2">
    </label>
    <button class="w-full rounded bg-stone-900 px-3 py-2 text-white hover:bg-stone-700">Log in</button>
  </form>
</div>
{{end}}

{{define "main"}}
<div class="flex min-h-0 flex-1">
  <aside class="w-64 shrink-0 overflow-auto border-r border-stone-200 bg-stone-100 p-3 text-sm">
    <details class="group mb-4">
      <summary class="flex cursor-pointer list-none items-center rounded px-2 py-1.5 font-semibold hover:bg-stone-200">
        {{.Workspace.Name}}<span class="ml-auto text-stone-400">▾</span>
      </summary>
      <div class="mt-1 space-y-1 rounded border border-stone-200 bg-white p-2">
        {{range .Workspaces}}
        <a href="/w/{{.ID}}" class="block rounded px-2 py-1 hover:bg-stone-100 {{if eq .ID $.Workspace.ID}}font-medium{{end}}">{{.Name}}</a>
        {{end}}
        <form method="post" action="/workspaces" class="flex gap-1 border-t border-stone-100 pt-2">
          <input name="name" placeholder="New workspace" required class="min-w-0 flex-1 rounded border border-stone-300 px-2 py-1">
          <button class="rounded bg-stone-900 px-2 py-1 text-white">+</button>
        </form>
        {{if .Workspace.CanEdit}}
        <form method="post" action="/w/{{.Workspace.ID}}/rename" class="flex gap-1">
          <input name="name" value="{{.Workspace.Name}}" required class="min-w-0 flex-1 rounded border border-stone-300 px-2 py-1">
          <button class="rounded border border-stone-300 px-2 py-1">Rename</button>
        </form>
        {{end}}
        {{if eq .Workspace.Role "owner"}}
        <form method="post" action="/w/{{.Workspace.ID}}/delete" hx-confirm="Delete this workspace and all its notes?">
          <button class="w-full rounded px-2 py-1 text-left text-red-600 hover:bg-red-50">Delete workspace</button>
        </form>
        {{end}}
      </div>
    </details>
    {{block "sidebar" .}}{{end}}
  </aside>
  {{block "workspace_body" .}}
  <section class="flex flex-1 items-center justify-center text-stone-400">Nothing here yet.</section>
  {{end}}
</div>
{{end}}

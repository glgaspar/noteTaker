{{define "content"}}
<div class="mx-auto mt-16 max-w-sm rounded-lg border border-stone-200 bg-white p-6 shadow-sm">
  {{if .Invalid}}
  <h1 class="mb-2 text-xl font-semibold">Link expired</h1>
  <p class="text-sm text-stone-600">This reset link is invalid or has expired. <a href="/forgot" class="underline">Request a new one</a>.</p>
  {{else}}
  <h1 class="mb-6 text-xl font-semibold">Choose a new password</h1>
  {{with .Error}}<p class="mb-4 rounded bg-red-50 px-3 py-2 text-sm text-red-700">{{.}}</p>{{end}}
  <form method="post" action="/reset/{{.Token}}" class="space-y-4">
    <input name="password" type="password" minlength="8" required autofocus placeholder="New password"
      class="w-full rounded border border-stone-300 px-3 py-2">
    <button class="w-full rounded bg-stone-900 px-3 py-2 text-white hover:bg-stone-700">Save password</button>
  </form>
  {{end}}
</div>
{{end}}

{{define "content"}}{{template "authcard" .}}{{end}}
{{define "auth"}}
{{if .Invalid}}
<h1 class="text-[18px] font-semibold">Link expired</h1>
<p class="mt-2 text-[13px] text-muted">This reset link is invalid or has expired. <a href="/forgot" class="text-accent hover:underline">Request a new one</a>.</p>
{{else}}
<h1 class="text-[18px] font-semibold">Choose a new password</h1>
<p class="mb-6 mt-1 text-[13px] text-muted">You'll be signed out on other devices.</p>
{{with .Error}}<p class="alert-error mb-4">{{.}}</p>{{end}}
<form method="post" action="/reset/{{.Token}}" class="space-y-4">
  <label class="block"><span class="label">New password</span>
    <input name="password" type="password" minlength="8" required autofocus class="input" placeholder="At least 8 characters">
  </label>
  <button class="btn-primary h-9 w-full justify-center">Save password</button>
</form>
{{end}}
{{end}}

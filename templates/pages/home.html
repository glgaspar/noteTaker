{{define "content"}}{{template "authcard" .}}{{end}}
{{define "auth"}}
<h1 class="text-[18px] font-semibold">Hi, {{.User.Name}}</h1>
<p class="mb-6 mt-1 text-[13px] text-muted">Create a workspace to start taking notes. You can invite others to it later.</p>
<form method="post" action="/workspaces" class="space-y-4">
  <label class="block"><span class="label">Workspace name</span>
    <input name="name" required autofocus class="input" placeholder="e.g. Personal, Team, Projects">
  </label>
  <button class="btn-primary h-9 w-full justify-center">Create workspace</button>
</form>
<p class="mt-4 text-center text-[13px] text-muted">or open your <a href="/tasks" class="text-accent hover:underline">Tasks</a></p>
{{end}}

{{define "content"}}
<a href="{{.Back}}" class="text-sm text-stone-500 hover:text-stone-900">← Back</a>
<h1 class="mt-2 text-2xl font-semibold">Move folder</h1>
<p class="mb-6 text-stone-600">📁 {{.Folder.Name}}, with its subfolders and notes</p>
<form method="post" action="/folders/{{.Folder.ID}}/move" class="flex gap-2 text-sm">
  <select name="parent_id" class="w-72 rounded border border-stone-300 px-2 py-2">
    {{if .CanRoot}}<option value="" {{if not .ParentID}}selected{{end}}>Workspace root</option>{{end}}
    {{range .Targets}}<option value="{{.ID}}" {{if eq .ID $.ParentID}}selected{{end}}>{{.Indent}}{{.Name}}</option>{{end}}
  </select>
  <button class="rounded bg-stone-900 px-4 py-2 text-white hover:bg-stone-700">Move</button>
</form>
{{end}}

{{define "content"}}
<a href="{{.Back}}" class="btn-ghost -ml-3">{{icon "arrow-left"}} Back</a>
<div class="card mx-auto mt-6 max-w-md p-5">
  <h1 class="text-[17px] font-semibold">Move folder</h1>
  <p class="mt-1 text-[13px] text-muted">“{{.Folder.Name}}” moves with its subfolders and notes.</p>
  <form method="post" action="/folders/{{.Folder.ID}}/move" class="mt-5">
    <label class="block"><span class="label">New location</span>
      <select name="parent_id" class="input">
        {{if .CanRoot}}<option value="" {{if not .ParentID}}selected{{end}}>Workspace root</option>{{end}}
        {{range .Targets}}<option value="{{.ID}}" {{if eq .ID $.ParentID}}selected{{end}}>{{.Indent}}{{.Name}}</option>{{end}}
      </select>
    </label>
    <div class="mt-5 flex justify-end gap-2">
      <a href="{{.Back}}" class="btn-ghost">Cancel</a>
      <button class="btn-primary">{{icon "folder-input"}} Move</button>
    </div>
  </form>
</div>
{{end}}

{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoteTaker</title>
  <script src="{{asset "/static/theme.js"}}"></script>
  <link rel="icon" href="{{asset "/static/favicon.svg"}}">
  <link rel="stylesheet" href="{{asset "/static/dist/app.css"}}">
  <script src="{{asset "/static/dist/app.js"}}" defer></script>
</head>
<body class="h-dvh overflow-hidden" hx-boost="true" data-icons="{{asset "/static/dist/icons.svg"}}">
  {{block "main" .}}
  <div class="flex h-dvh flex-col">
    {{if .User}}{{template "topbar" .}}{{end}}
    <main class="flex-1 overflow-auto">
      <div class="mx-auto w-full max-w-3xl px-4 py-10 sm:px-6">{{template "content" .}}</div>
    </main>
  </div>
  {{end}}
  {{template "dialogs" .}}
</body>
</html>{{end}}
